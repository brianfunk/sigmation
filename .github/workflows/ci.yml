name: CI

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
      - name: Smoke the packed CLI through its bin link (as npx would)
        run: |
          npm pack --silent
          d=$(mktemp -d) && cd "$d" && npm init -y >/dev/null && npm i --silent "$OLDPWD"/sigmation-*.tgz
          out=$(npx sigmation 'E=mc^2' -f badge --label ci)
          echo "$out" | head -c 200; echo
          echo "$out" | grep -q '^<svg' || { echo "CLI produced no output"; exit 1; }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
