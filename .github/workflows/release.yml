name: Release

# Publishes to npm when a v* tag is pushed. Uses npm trusted publishing (OIDC),
# so no NPM_TOKEN secret is needed. One-time setup on npmjs.com:
#   package sigmation -> Settings -> Trusted publisher -> GitHub Actions
#   owner: brianfunk, repo: sigmation, workflow: release.yml
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Update npm (trusted publishing needs 11.5+)
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "tag v$TAG != package.json $PKG"; exit 1; }
      - name: Skip if this version is already on npm
        id: check
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "sigmation@$PKG" version >/dev/null 2>&1; then
            echo "sigmation@$PKG already published, skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        run: npm run lint
      - if: steps.check.outputs.skip != 'true'
        run: npm test
      - if: steps.check.outputs.skip != 'true'
        run: npm run build:lib
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public
